name: Bug report
description: Report a problem with podkop-mcp
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem.

        > [!WARNING]
        > Remove secrets before posting: subscription URLs, `proxy_string`
        > values and keys. Replace them with `***` or delete them from the
        > output.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: The actual behavior. Include the tool call and the response you got.
      placeholder: "podkop_domains_add(...) returned ... instead of ..."
    validations:
      required: true

  - type: textarea
    id: what-expected
    attributes:
      label: What did you expect to happen?
      description: The behavior you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: Numbered steps that lead to the problem.
      placeholder: |
        1. Configure the MCP server with ...
        2. Call ...
        3. See ...
    validations:
      required: true

  - type: input
    id: mcp-client
    attributes:
      label: MCP client and version
      description: The client that runs the server, with its version.
      placeholder: "e.g. Claude Desktop 0.12.0, Cursor 0.45, Cline 3.1"
    validations:
      required: true

  - type: textarea
    id: versions
    attributes:
      label: Router, OpenWrt, Forkop and Podkop versions
      description: Router model, OpenWrt version, and the Forkop or Podkop version. `podkop_doctor` reports most of these.
      placeholder: |
        Router: ...
        OpenWrt: ...
        Forkop: ... / Podkop: ...
    validations:
      required: true

  - type: textarea
    id: doctor-output
    attributes:
      label: podkop_doctor output
      description: |
        Run `podkop_doctor` in your MCP client and paste the full output.
        The server masks secrets as `***` by default; still remove
        subscription URLs, `proxy_string` values and keys before posting.
        If the server does not start at all, paste the error instead.
      render: text
      placeholder: |
        {
          "ok": true,
          ...
        }
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        > [!WARNING]
        > Subscription URLs, `proxy_string` values and keys are secrets. Remove
        > them before posting — a public issue is visible to everyone.
