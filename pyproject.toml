[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "podkop-mcp"
dynamic = ["version"]
description = "MCP server for managing Podkop and Forkop on OpenWrt over SSH"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mikhail", email = "mikel38487@users.noreply.github.com" }]
keywords = ["mcp", "openwrt", "podkop", "forkop", "sing-box", "ssh"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Networking",
]
dependencies = [
  "mcp>=2.3,<3",
  "paramiko>=4,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.9",
]

[project.scripts]
podkop-mcp = "podkop_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/mikel38487/podkop-mcp"
Repository = "https://github.com/mikel38487/podkop-mcp"
Issues = "https://github.com/mikel38487/podkop-mcp/issues"
Changelog = "https://github.com/mikel38487/podkop-mcp/blob/main/CHANGELOG.md"
Documentation = "https://github.com/mikel38487/podkop-mcp/tree/main/docs"

[tool.hatch.version]
path = "src/podkop_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/podkop_mcp"]

[tool.hatch.build.targets.sdist]
include = [
  "src/podkop_mcp", "tests", "docs", "scripts",
  "README.md", "README.ru.md", "CHANGELOG.md", "CONTRIBUTING.md",
  "CONTRIBUTING.ru.md", "SECURITY.md", "SECURITY.ru.md", "LICENSE",
  "pyproject.toml", "mcp.json.example", ".env.example",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["research", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "live: read-only tests against a real router (set PODKOP_MCP_LIVE=1)",
  "docker: integration tests in an OpenWrt rootfs container (requires Docker)",
  "docker_ssh: tests against an OpenWrt Docker container over real SSH",
]

